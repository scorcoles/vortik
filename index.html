<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vortik</title>
    <meta name="description" content="Vortik: un remolino de fibras que gira y se deja remover con el ratón o el dedo. Un experimento de VERTIK." />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- El escenario: Three.js dibuja aquí todo lo que se mueve. -->
    <canvas data-vortik aria-label="Vortik: un remolino de fibras blancas sobre negro que se puede remover" role="img"></canvas>

    <!-- El desgaste del cartón en el modo cover: grano, manchas y bordes más oscuros.
         Va encima del canvas y deja pasar el ratón y el dedo (ver style.css). -->
    <div class="wear" aria-hidden="true"></div>
    <!-- Y encima, el desgaste de fotocopia: motas, zonas gastadas y rayas (src/toner.js). -->
    <div class="toner" aria-hidden="true"></div>

    <!-- El cajetín del modo wire: qué es y con qué números funciona (src/notes.js). -->
    <div class="notes" data-notes aria-hidden="true"></div>

    <!-- Arriba a la derecha: el sonido (src/sound.js), apagado de entrada, y compartir una
         foto de cómo está ahora el remolino (src/share.js; si el navegador no sabe
         compartir imágenes, no aparece). -->
    <div class="tools">
      <button type="button" class="sound" data-sound aria-pressed="false" aria-label="Encender el sonido">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9h3.5L12 4.5v15L6.5 15H3z" fill="currentColor" stroke="none" />
          <path class="sound__on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4" />
          <path class="sound__off" d="M15.8 9.2l5.2 5.6M21 9.2l-5.2 5.6" />
        </svg>
      </button>
      <button type="button" class="share" data-share hidden aria-label="Compartir una imagen del remolino">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M8.6 10.5 15.4 6.5M8.6 13.5l6.8 4" fill="none" />
          <circle cx="18" cy="5" r="3" stroke="none" />
          <circle cx="6" cy="12" r="3" stroke="none" />
          <circle cx="18" cy="19" r="3" stroke="none" />
        </svg>
      </button>
    </div>

    <!-- Pie con las instrucciones y los créditos. -->
    <p class="credit">
      <span class="credit__tag">vortik</span>
      Mueve el ratón o el dedo para remover las fibras<span class="credit__sep">·</span><wbr />Arrastra (o usa dos dedos) para inclinarlas<span class="credit__sep">·</span><wbr />Doble clic (o doble toque) para uno nuevo<span class="credit__sep">·</span><wbr />Homenaje a <a href="https://www.youtube.com/watch?v=BiVRDuIUKfA&amp;list=OLAK5uy_l8Qxdj6Uvs5vhsUzVTHRmUoHcGrPncBwA" target="_blank" rel="noopener">Dysnomia — Dawn of Midi, 2013</a><span class="credit__sep">·</span><wbr /><span class="credit__modes"><button type="button" data-mode-prev aria-label="Visualización anterior">← Prev</button><span class="credit__sep">·</span><button type="button" class="credit__info" data-notes-toggle aria-expanded="false">Info</button><button type="button" data-mode-next aria-label="Visualización siguiente">Next →</button></span>
    </p>

    <!-- Un módulo: Vite sigue sus «import» y sirve Three.js desde node_modules. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
