<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vortik</title>
    <meta name="description" content="Vortik: un remolino de fibras que gira y se deja remover con el ratón o el dedo. Un experimento de VERTIK." />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- El escenario: Three.js dibuja aquí todo lo que se mueve. -->
    <canvas data-vortik aria-label="Vortik: un remolino de fibras blancas sobre negro que se puede remover" role="img"></canvas>

    <!-- El desgaste del cartón en el modo portada: grano, manchas y bordes más oscuros.
         Va encima del canvas y deja pasar el ratón y el dedo (ver style.css). -->
    <div class="wear" aria-hidden="true"></div>
    <!-- Y encima, el desgaste de fotocopia: motas, zonas gastadas y rayas (src/toner.js). -->
    <div class="toner" aria-hidden="true"></div>

    <!-- Pie con las instrucciones y los créditos. -->
    <p class="credit">
      <span class="credit__tag">vortik</span>
      Mueve el ratón o el dedo para remover las fibras<span class="credit__sep">·</span><wbr />Homenaje a <a href="https://www.youtube.com/watch?v=BiVRDuIUKfA&amp;list=OLAK5uy_l8Qxdj6Uvs5vhsUzVTHRmUoHcGrPncBwA" target="_blank" rel="noopener">Dysnomia — Dawn of Midi, 2013</a><span class="credit__sep">·</span><wbr />Un experimento de <a href="https://www.vertik.net">VERTIK</a><span class="credit__sep">·</span><wbr /><span class="credit__modes"><button type="button" data-mode-prev aria-label="Visualización anterior">← Prev</button><span class="credit__sep">·</span><button type="button" data-mode-next aria-label="Visualización siguiente">Next →</button></span>
      <!-- En el modo esquema: qué color es cada familia. -->
      <span class="credit__legend"><i style="--c: #ffd166"></i>micropelos <i style="--c: #ef476f"></i>pelitos <i style="--c: #06d6a0"></i>corrientes <i style="--c: #4cc9f0"></i>maraña</span>
    </p>

    <!-- Un módulo: Vite sigue sus «import» y sirve Three.js desde node_modules. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
